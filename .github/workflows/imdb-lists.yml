name: Update IMDb Top 10 lists

# Run by hand (Actions tab -> Update IMDb Top 10 lists -> Run workflow). Downloads IMDb's official
# non-commercial data files, rebuilds the ready-made lists and pushes them to the "imdb-lists" branch
# for review. Nothing reaches main or a release until that branch is merged.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download IMDb data files
        run: |
          mkdir -p "$RUNNER_TEMP/imdb"
          for f in title.basics.tsv.gz title.ratings.tsv.gz; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/imdb/$f" "https://datasets.imdbws.com/$f"
          done
          ls -l "$RUNNER_TEMP/imdb"
      - name: Build lists
        run: |
          python build/build_imdb_lists.py \
            --basics "$RUNNER_TEMP/imdb/title.basics.tsv.gz" \
            --ratings "$RUNNER_TEMP/imdb/title.ratings.tsv.gz" \
            --out Jellyfin.Plugin.RaceToFinish/TopTen/imdb-top10.json | tee "$RUNNER_TEMP/lists.txt"
          { echo '```'; cat "$RUNNER_TEMP/lists.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Push to the imdb-lists branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B imdb-lists
          git add Jellyfin.Plugin.RaceToFinish/TopTen/imdb-top10.json
          if git diff --cached --quiet; then
            echo "Lists unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Update IMDb Top 10 lists"
          git push --force origin imdb-lists
