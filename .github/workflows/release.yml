name: Release

# Publish a version: GitHub → Actions → Release → Run workflow, enter the
# version (e.g. 0.1.0) and what changed. Pushing a tag like v0.1.0 works too.
# This builds the plugin, makes a GitHub Release with the zip, and adds the
# version to manifest.json so Jellyfin offers it as an install or update.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, like 0.1.0'
        required: true
      notes:
        description: 'What changed (shown in Jellyfin)'
        required: true
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            NOTES="$INPUT_NOTES"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP/,$d')"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must look like 1.2.3, got '$VERSION'"; exit 1
          fi
          # Guard: the code being built must declare this version, so a release can never
          # ship older code under a newer number.
          CODE_VERSION="$(grep -oP '(?<=<Version>)[^<]+' Jellyfin.Plugin.RaceToFinish/Jellyfin.Plugin.RaceToFinish.csproj)"
          if [ "$CODE_VERSION" != "$VERSION" ]; then
            echo "Version mismatch: you asked for $VERSION but the code on this branch is $CODE_VERSION. Push the version bump first."; exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION was already released. Use a new version number."; exit 1
          fi
          [ -z "$NOTES" ] && NOTES="Release $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "full=$VERSION.0" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          { echo 'notes<<NOTES_EOF'; echo "$NOTES"; echo 'NOTES_EOF'; } >> "$GITHUB_OUTPUT"

      - name: Check the built-in Top 10 lists
        run: |
          python3 - <<'PY'
          import json, sys
          data = json.load(open("Jellyfin.Plugin.RaceToFinish/TopTen/imdb-top10.json"))
          missing = [y for y in range(2020, 2026) if len(data.get("years", {}).get(str(y), {}).get("movies", [])) != 10]
          if missing:
              sys.exit(f"Top 10 lists missing or short for {missing}. Run 'Update IMDb Top 10 lists' and merge the imdb-lists branch first.")
          print("Top 10 lists OK, made", data.get("generatedUtc"))
          PY

      - name: Build
        run: |
          node --check Jellyfin.Plugin.RaceToFinish/Web/rtf.js
          dotnet publish Jellyfin.Plugin.RaceToFinish/Jellyfin.Plugin.RaceToFinish.csproj -c Release -o out -p:Version=${{ steps.v.outputs.version }}

      - name: Package
        id: pkg
        run: |
          ZIP="race-to-finish_${{ steps.v.outputs.full }}.zip"
          (cd out && zip -j "../$ZIP" Jellyfin.Plugin.RaceToFinish.dll)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.v.outputs.notes }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" "${{ steps.pkg.outputs.zip }}" \
            --target "${GITHUB_SHA}" \
            --title "Race to Finish ${{ steps.v.outputs.version }}" \
            --notes "$NOTES"

      - name: Add version to manifest.json
        env:
          VERSION: ${{ steps.v.outputs.full }}
          TAG: ${{ steps.v.outputs.tag }}
          ZIP: ${{ steps.pkg.outputs.zip }}
          MD5: ${{ steps.pkg.outputs.md5 }}
          NOTES: ${{ steps.v.outputs.notes }}
        run: |
          git fetch origin main
          git checkout main
          python3 build/update_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: add $VERSION"
          git push origin main
