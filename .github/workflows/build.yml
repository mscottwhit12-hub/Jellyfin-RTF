name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Jellyfin.Plugin.RaceToFinish/Jellyfin.Plugin.RaceToFinish.csproj -c Release
      - name: Check web script syntax
        run: node --check Jellyfin.Plugin.RaceToFinish/Web/rtf.js
